name: Sensitive File Audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit-sensitive-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit tracked files for secrets and wallet exports
        run: npm run audit:sensitive
